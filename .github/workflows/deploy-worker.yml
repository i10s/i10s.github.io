name: Deploy Worker

# Deploys worker/ (the /mcp, /a2a, /api, /ask and / routes on ifuentes.net) after the tests pass on
# main. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets from the personal account
# that owns the ifuentes.net zone; without them the job is skipped.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Worker changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD~1 HEAD -- worker/; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Credentials present?
        if: steps.changed.outputs.deploy == 'true' && env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping the Worker deploy."

      - uses: actions/setup-node@v5
        if: steps.changed.outputs.deploy == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22

      - name: Deploy
        if: steps.changed.outputs.deploy == 'true' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy
