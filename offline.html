<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline · Iñaki Fuentes</title>
  <meta name="description" content="You are offline. Pages you have already visited on ifuentes.net are still available.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2efe7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
:root{--color-bg:#f2efe7;--color-text:#141414;--fg2:#45423c;--mute:#66635c;--link:#141414;--hi:#26272c;--lo:#1d1e22;--ink:#f4f1e8}
@media (prefers-color-scheme: dark){:root{--color-bg:#0c0d0f;--color-text:#f2efe8;--fg2:#bdb9b0;--mute:#97938b;--link:#ffd447}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
body{display:grid;place-items:center;min-height:100vh;padding:2rem clamp(1.1rem,4vw,2.5rem);background:var(--color-bg);color:var(--color-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:clamp(1rem,.96rem + .2vw,1.125rem);line-height:1.6}
main{max-width:40rem}
a{color:var(--link);text-underline-offset:.22em}
:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.eyebrow,h1,small{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.1em}
.eyebrow,small{font-size:0.8rem;color:var(--mute)}
h1{margin:1.2rem 0 1.6rem;font-size:clamp(2.4rem,11vw,4.5rem);line-height:1}
.tiles,.w{display:flex;flex-wrap:wrap;gap:.16em .4em}
.w{flex-wrap:nowrap;gap:.07em}
.tiles i{position:relative;display:grid;place-items:center;width:.84em;height:1.2em;border-radius:.09em;background:linear-gradient(var(--hi) 50%,var(--lo) 50%);color:var(--ink);font-style:normal;box-shadow:0 .06em .14em #0005}
.tiles i::before,.tiles i::after{content:"";position:absolute;inset:0 0 50%}
.tiles i::after{inset:calc(50% - .5px) 0 auto;height:1px;background:#0009}
.tiles i::before{border-radius:inherit;background:var(--hi);transform:scaleY(0);transform-origin:bottom}
.tiles .a::before{animation:fa 60ms ease-in}
.tiles .b::before{animation:fb 60ms ease-in}
@keyframes fa{from{transform:scaleY(1)}}
@keyframes fb{from{transform:scaleY(1)}}
.lede{font-size:clamp(1.3rem,1.05rem + 1.2vw,1.9rem);font-weight:650;line-height:1.3;letter-spacing:-.02em}
p+p{margin-top:1rem;color:var(--fg2)}
small{display:block;margin-top:2.5rem}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">No connection</p>
  <h1><span class="sr">You're offline</span><span class="tiles" data-tiles aria-hidden="true"><span class="w"><i>D</i><i>E</i><i>L</i><i>A</i><i>Y</i><i>E</i><i>D</i></span></span></h1>
  <p class="lede">You're offline, so this flight is delayed, not cancelled.</p>
  <p>Pages you have already visited still work. Once you're back online, <a href="/">return to the home page</a>.</p>
  <small>Built to degrade gracefully. No trackers. Fast by design.</small>
</main>
<script src="/flap.js" defer></script>
</body>
</html>
